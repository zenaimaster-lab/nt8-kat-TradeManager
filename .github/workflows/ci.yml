name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: version consistency
        shell: pwsh
        run: pwsh scripts/Verify-Version.ps1 -Strict
      - name: xunit suite
        run: dotnet test tests/KatTradeManager.Tests --nologo --verbosity minimal
      - name: compile gate (net48)
        continue-on-error: true
        run: dotnet build tools/CompileCheck --nologo --verbosity minimal
