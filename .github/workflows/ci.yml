name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: version consistency
        shell: pwsh
        run: pwsh scripts/Verify-Version.ps1 -Strict
      - name: format check
        run: dotnet format tests/KatTradeManager.Tests/KatTradeManager.Tests.csproj --verify-no-changes --verbosity diagnostic
      - name: ps analyze
        shell: pwsh
        run: |
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $r = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
            $r | Format-Table -AutoSize
            if ($r) { Write-Host "::error::PSScriptAnalyzer Error severity found"; exit 1 }
            Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning | Format-Table -AutoSize
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::PSScriptAnalyzer Warning — check logs" }
          } else { Write-Host "PSScriptAnalyzer not installed — skip (Install-Module PSScriptAnalyzer)" }
      - name: xunit suite
        run: dotnet test tests/KatTradeManager.Tests --nologo --verbosity minimal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: coverage gate (<60% warn, private repo)
        shell: pwsh
        run: |
          $f = Get-ChildItem -Path tests/KatTradeManager.Tests/TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($f) { [xml]$c = Get-Content $f.FullName; $r=[double]$c.coverage.'line-rate'*100; $valid=[int]$c.coverage.'lines-valid'; Write-Host ("coverage {0:N1}% ({1} lines-valid)" -f $r, $valid); if ($valid -eq 0) { Write-Host "::warning::coverage 0 lines-valid — coverlet not instrumenting on this runner (private repo, NT8 refs) — skip" } elseif ($r -lt 60) { Write-Host "::warning::coverage <60% — add tests (advisory for private repo)" } } else { Write-Host "no coverage file — skip" }
      - name: compile gate (net48)
        run: dotnet build tools/CompileCheck --nologo --verbosity minimal
